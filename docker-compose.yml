services:
  esim-db:
    image: postgres:16-alpine
    container_name: esim-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-esim_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esim_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-esim_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-esim_user} -d ${POSTGRES_DB:-esim_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - esim-network

  esim-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esim-backend
    restart: unless-stopped
    depends_on:
      esim-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-esim_user}:${POSTGRES_PASSWORD:-esim_secure_password_2026}@esim-db:5432/${POSTGRES_DB:-esim_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY env var is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      VIVAPE_BASE_URL: ${VIVAPE_BASE_URL:-https://app.vivape.net/api}
      VIVAPE_EMAIL: ${VIVAPE_EMAIL:?VIVAPE_EMAIL env var is required}
      VIVAPE_PASSWORD: ${VIVAPE_PASSWORD:?VIVAPE_PASSWORD env var is required}
      SHURJOPAY_BASE_URL: ${SHURJOPAY_BASE_URL:-https://sandbox.shurjopayment.com}
      SHURJOPAY_USERNAME: ${SHURJOPAY_USERNAME:?SHURJOPAY_USERNAME env var is required}
      SHURJOPAY_PASSWORD: ${SHURJOPAY_PASSWORD:?SHURJOPAY_PASSWORD env var is required}
      SHURJOPAY_PREFIX: ${SHURJOPAY_PREFIX:-NOK}
      SHURJOPAY_RETURN_URL: ${SHURJOPAY_RETURN_URL:-https://esim.salmandev.io/api/v1/payments/shurjopay/callback}
      SHURJOPAY_CANCEL_URL: ${SHURJOPAY_CANCEL_URL:-https://esim.salmandev.io/wallet?topup=cancelled}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://esim.salmandev.io}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://esim.salmandev.io}
      UPLOADS_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/var/log/esim
    networks:
      - esim-network
      - dokploy-network

  esim-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time,
      # so they must be passed as build args, not (only) as the container's
      # runtime environment below — a running container's env has no effect
      # on JS that was already bundled into a prior build.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://esim.salmandev.io}
        NEXT_PUBLIC_DEFAULT_CURRENCY: ${NEXT_PUBLIC_DEFAULT_CURRENCY:-USD}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
    container_name: esim-frontend
    restart: unless-stopped
    depends_on:
      - esim-backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://esim.salmandev.io}
      NEXT_PUBLIC_DEFAULT_CURRENCY: ${NEXT_PUBLIC_DEFAULT_CURRENCY:-USD}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    networks:
      - esim-network
      - dokploy-network

volumes:
  postgres_data:
    name: esim_postgres_data
  uploads_data:
    name: esim_uploads_data
  logs_data:
    name: esim_logs_data

networks:
  esim-network:
    name: esim-network
    driver: bridge
  dokploy-network:
    external: true
