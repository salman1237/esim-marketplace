services:
  esim-db:
    image: postgres:16-alpine
    container_name: esim-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-esim_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esim_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-esim_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-esim_user} -d ${POSTGRES_DB:-esim_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - esim-network

  esim-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esim-backend
    restart: unless-stopped
    depends_on:
      esim-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-esim_user}:${POSTGRES_PASSWORD:-esim_secure_password_2026}@esim-db:5432/${POSTGRES_DB:-esim_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY env var is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      VIVAPE_BASE_URL: ${VIVAPE_BASE_URL:-https://app.vivape.net/api}
      CATALOG_SYNC_INTERVAL_HOURS: ${CATALOG_SYNC_INTERVAL_HOURS:-4}
      # Timezone assumed for supplier timestamps that arrive with no offset
      # (VivaPe passes the upstream carrier's naive local strings straight
      # through). Anything carrying a real offset ignores this. Named here
      # because Compose only forwards variables it lists - the same omission
      # silently disabled SMTP once already.
      SUPPLIER_TIMEZONE: ${SUPPLIER_TIMEZONE:-Asia/Hong_Kong}
      VIVAPE_EMAIL: ${VIVAPE_EMAIL:?VIVAPE_EMAIL env var is required}
      VIVAPE_PASSWORD: ${VIVAPE_PASSWORD:?VIVAPE_PASSWORD env var is required}
      SHURJOPAY_BASE_URL: ${SHURJOPAY_BASE_URL:-https://sandbox.shurjopayment.com}
      SHURJOPAY_USERNAME: ${SHURJOPAY_USERNAME:?SHURJOPAY_USERNAME env var is required}
      SHURJOPAY_PASSWORD: ${SHURJOPAY_PASSWORD:?SHURJOPAY_PASSWORD env var is required}
      SHURJOPAY_PREFIX: ${SHURJOPAY_PREFIX:-NOK}
      SHURJOPAY_RETURN_URL: ${SHURJOPAY_RETURN_URL:-https://triptel.co/api/v1/payments/shurjopay/callback}
      SHURJOPAY_CANCEL_URL: ${SHURJOPAY_CANCEL_URL:-https://triptel.co/wallet?topup=cancelled}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://triptel.co}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://triptel.co}
      # Sign in with Google (OAuth Web client ID, Google Cloud project
      # "triptel"). Public, not a secret - it ships to every browser. The
      # client *secret* is not used by this flow and must not be set anywhere.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-1095507553767-hkuh44db04q1lvrnptill6frtckcb42t.apps.googleusercontent.com}
      # Outgoing mail. Compose only passes through variables named here, so
      # omitting these left SMTP unset inside the container no matter what
      # was configured in the deploy environment - welcome, password-reset
      # and eSIM delivery emails were silently skipped.
      # SMTP_PORT selects the encryption mode: 465 = implicit TLS, 587 =
      # STARTTLS (see EmailService._send).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@triptel.co}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Triptel}
      # Blind copy of every outgoing email. Named here because Compose only
      # forwards variables it lists - the same omission silently disabled
      # SMTP itself once already.
      NOTICE_BCC_EMAIL: ${NOTICE_BCC_EMAIL:-triptel.com@gmail.com}
      UPLOADS_DIR: /app/uploads
      KYC_UPLOADS_DIR: /app/kyc_uploads
      # Payout proof screenshots. Its own volume, like KYC: these are the
      # only evidence a withdrawal was actually sent, so they must survive a
      # redeploy, and they are never served from the public uploads mount.
      WITHDRAWAL_UPLOADS_DIR: /app/withdrawal_uploads
      # Support ticket attachments. Its own volume for the same reason as the
      # two above: a customer troubleshooting an eSIM photographs a screen
      # showing their own details, and those must survive a redeploy while
      # never being reachable from the public uploads mount.
      SUPPORT_UPLOADS_DIR: /app/support_uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
      - kyc_uploads_data:/app/kyc_uploads
      - withdrawal_uploads_data:/app/withdrawal_uploads
      - support_uploads_data:/app/support_uploads
      - logs_data:/var/log/esim
    networks:
      - esim-network
      - dokploy-network

  esim-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time,
      # so they must be passed as build args, not (only) as the container's
      # runtime environment below — a running container's env has no effect
      # on JS that was already bundled into a prior build.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://triptel.co}
        NEXT_PUBLIC_DEFAULT_CURRENCY: ${NEXT_PUBLIC_DEFAULT_CURRENCY:-BDT}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
    container_name: esim-frontend
    restart: unless-stopped
    depends_on:
      - esim-backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://triptel.co}
      NEXT_PUBLIC_DEFAULT_CURRENCY: ${NEXT_PUBLIC_DEFAULT_CURRENCY:-BDT}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    networks:
      - esim-network
      - dokploy-network

volumes:
  postgres_data:
    name: esim_postgres_data
  uploads_data:
    name: esim_uploads_data
  kyc_uploads_data:
    name: esim_kyc_uploads_data
  withdrawal_uploads_data:
    name: esim_withdrawal_uploads_data
  support_uploads_data:
    name: esim_support_uploads_data
  logs_data:
    name: esim_logs_data

networks:
  esim-network:
    name: esim-network
    driver: bridge
  dokploy-network:
    external: true
