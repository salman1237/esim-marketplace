<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0f172a;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:480px;background:#1e293b;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:28px 32px 0 32px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:20px;font-weight:800;color:#ffffff;">{{ platform_name }}</span>
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 32px 32px;color:#cbd5e1;font-size:14px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 28px 32px;border-top:1px solid rgba(255,255,255,0.08);">
              <p style="margin:0;color:#64748b;font-size:11px;">
                &copy; {{ year }} {{ platform_name }}. This is an automated message, please don't reply directly to this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
